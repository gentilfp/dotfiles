# Atuin configuration.
# Omitted keys use built-in defaults. Inspect effective values with:
#   atuin config get <key> --resolved

# --- search / UI ------------------------------------------------------------
search_mode = "prefix"        # prefix | fulltext | fuzzy | daemon-fuzzy
filter_mode = "global"
style = "full"

# Enter immediately runs the selected command (Tab returns it to the prompt
# for editing). Without this line, existing installs default to two Enter presses.
enter_accept = true

# --- sync --------------------------------------------------------------------
auto_sync = true
sync_frequency = "1h"         # client-side cadence
update_check = false

[sync]
records = true                # record-based sync (v2)

# --- daemon -------------------------------------------------------------------
# Faster writes, background sync, in-memory search index. The daemon does the
# real periodic syncing (default 300s), so keep it in step with sync_frequency.
[daemon]
enabled = true
autostart = true
sync_frequency = 3600         # seconds

# --- history filtering ----------------------------------------------------------
# Commands matching any of these regexes are never saved. These are TOP-LEVEL
# keys: inside [daemon] they would be silently ignored (18.21 ignores unknown
# section keys). Single quotes keep \b as a regex word-boundary (in TOML,
# double-quoted "\b" would be a literal backspace). E.g. '^ls\b' keeps lsblk/lsof.
history_filter = [
    '^cd\b',
    '^ls\b',
    '^pwd\b',
    '^exit\b',
    '^clear\b',
    '^auth\b',
    '^export [A-Z_]+=',
]