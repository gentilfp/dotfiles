# herdr config → symlinked to ~/.config/herdr/config.toml
# Runtime state (sessions/, *.sock, *.log) stays local and is NOT tracked.
onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[theme]
name = "dracula"
auto_switch = false

[worktrees]
directory = "~/Developer/.worktrees"

[experimental]
kitty_graphics = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "$pr"], ["agent"]]
