# herdr config → symlinked to ~/.config/herdr/config.toml
# Runtime state (sessions/, *.sock, *.log) stays local and is NOT tracked.
onboarding = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
window_title = "{terminal_title} · {workspace}"
tab_bar_right = [
  { type = "command", command = '''aij verbose | jq -r 'def rem($id; $kind): [.providers[] | select(.id == $id) | .limits[] | select(.kind == $kind) | .remainingPercent][0] // "-"; def bal: [.providers[] | select(.id == "opencode") | .balanceUsd][0]; "❇ \(rem("claude";"session"))%(5h) \(rem("claude";"weekly"))%(7d) 󰅟 \(rem("codex";"session"))%(5h) \(rem("codex";"weekly"))%(7d) □ \(rem("opencode";"session"))%(5h) \(rem("opencode";"weekly"))%(7d) \(rem("opencode";"monthly"))%(30d)" + (if bal == null then "" else " $\(bal)" end)' ''', interval_seconds = 60, timeout_seconds = 10 },
]

[ui.toast]
delivery = "terminal"

[theme]
name = "dracula"
auto_switch = false

[worktrees]
directory = "~/Developer/.worktrees"

[experimental]
kitty_graphics = true

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]


[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "agent", bold = true }, "state_text"],
  ["workspace"],
]
