# mise global tool versions → symlinked to ~/.config/mise/config.toml
# Edit freely per machine/job. Run `mise install` to materialise these.
#
# Pinning strategy for this *global* baseline:
#   - Languages: loose major(.minor) pins — mise resolves the latest patch.
#   - Cloud/infra CLIs: "latest" — anything that must match a cluster or a
#     project belongs in a repo-local .mise.toml / .tool-versions instead.
[tools]
ruby = "3.4"
node = "22"
python = "3.13"

aws = { version = "latest", symlink_bins = "true" }
helm = "latest"
kubectl = "latest"
kubectx = "latest"
sops = "latest"
terraform = "latest"
